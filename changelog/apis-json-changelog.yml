description: >-
  Release history of the APIs.json specification. Every version is published as a
  numbered draft at https://apisjson.org/format/apisjson_<version>.txt, with a dated
  "What's New" post on the specification blog and a rendered diff in the
  github.com/apis-json/diff repository. Recent window only.
scheme: informal-draft
scheme_note: >-
  Two-part decimal draft numbering (0.11 through 0.23). There is no 1.0 release and
  no stated date for one; the specification describes itself as a "Draft for Comment".
  Each release ships as a plain-text draft plus a JSON Schema of the same version
  number (spec/schema_<version>.yml in the specification repository).
