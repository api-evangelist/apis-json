findings:
  - >-
    No SDKs pointer is emitted. An SDKs pointer with zero installable packages behind it
    would be a false claim.
  - >-
    The decay signal here is real but it belongs to tooling, not to a client library:
    builder, backstage and apis-json-opionated have not been touched since 2023, while
    the specification itself moved through five releases (0.19 to 0.23) in 2026. The
    builder predates the prompts, rules and workflows collections added in 0.21 and the
    roughly seventy property types registered in 0.22 and 0.23.
  - >-
    A format specification does not strictly need a client library, but the absence of
    any registry-installable validator is the gap most likely to be felt: consumers must
    wire the published JSON Schema into their own validator by hand.
