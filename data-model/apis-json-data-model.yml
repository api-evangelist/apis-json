derived_observations:
  - >-
    The common/properties split is the model's central idea and it is expressed purely
    by placement: both collections $ref the identical urls entity, so the only thing
    distinguishing an index-wide resource from an API-specific one is which array it
    sits in.
  - >-
    0.21's prompts, rules and workflows are not new shapes. They are three more arrays
    of the same urls entity, mirrored at both levels — which is why the release is
    structural but not breaking.
  - >-
    include is the only self-referential edge in the model: an index points at another
    index, which is how federated catalogs compose.
  - >-
    The api entity has six required fields (name, description, image, baseURL, humanURL,
    properties) against the index's six — notably image and baseURL are required on
    every API entry, which is stricter than most published indexes in the wild.
  - >-
    There is no id-reference pattern anywhere in the model. Every relationship is
    containment or an outbound URL; nothing joins by foreign key.
