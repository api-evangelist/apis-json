apis:
  - aid: apis-json:apis-json-specification
    name: APIs.json Specification
    description: >-
      The APIs.json specification defines a machine-readable JSON format for
      describing API operations. It does not describe APIs like OpenAPI does,
      but describes surrounding API operations with entries that can reference
      OpenAPI or any other format. It was created by Kin Lane and Steven
      Willmott in May 2014.
