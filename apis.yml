aid: apis-json
name: APIs.json
description: >-
  APIs.json is an open, machine-readable specification that API providers can
  use to describe their API operations, similar to how websites use sitemap.xml.
  It provides a format for API discovery and cataloging, enabling search engines
  like APIs.io to index API collections across the web.
type: Index
